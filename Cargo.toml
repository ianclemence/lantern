[workspace]
resolver = "2"
members = [
    "crates/lantern-core",
    "crates/lantern-llm",
    "crates/lantern-tools",
    "crates/lantern-agent",
    "crates/lantern-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["ianclemence"]
repository = "https://github.com/ianclemence/lantern"
description = "Native, container-free autonomous security assessment agent for small Linux hosts"

[workspace.dependencies]
# internal
lantern-core = { path = "crates/lantern-core" }
lantern-llm = { path = "crates/lantern-llm" }
lantern-tools = { path = "crates/lantern-tools" }
lantern-agent = { path = "crates/lantern-agent" }

# async runtime
tokio = { version = "1.45", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "net",
    "io-util",
    "time",
    "sync",
    "fs",
    "signal",
] }

# http / tls (system OpenSSL 3.5 is present; avoids cmake + ring build on aarch64)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "gzip",
    "native-tls",
    "charset",
] }
native-tls = "0.2"
tokio-native-tls = "0.3"

# storage
rusqlite = { version = "0.32", features = ["bundled-full"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# agent / tooling support
hickory-resolver = "0.25"
x509-parser = "0.16"
scraper = "0.21"
flate2 = "1"
regex = "1"
rlimit = "0.10"
libc = "0.2"

# cli + logging
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# error handling
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false

[profile.dev]
opt-level = 0
debug = 1
